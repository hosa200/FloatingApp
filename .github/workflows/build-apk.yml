name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Install Gradle 8.5 (Fast CDN)
      run: |
        curl -sSL --retry 5 --retry-connrefused -o /tmp/gradle-8.5-bin.zip https://downloads.gradle-dn.com/distributions/gradle-8.5-bin.zip || \
        curl -sSL --retry 5 --retry-connrefused -o /tmp/gradle-8.5-bin.zip https://mirrors.cloud.tencent.com/gradle/gradle-8.5-bin.zip
        sudo unzip -q -o /tmp/gradle-8.5-bin.zip -d /opt
        echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH

    - name: Build Debug APK
      run: |
        gradle assembleDebug --stacktrace --no-daemon

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nusuk-AI-Helper-APK
        path: app/build/outputs/apk/debug/app-debug.apk